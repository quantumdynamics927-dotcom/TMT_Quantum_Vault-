name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'hf-deploy/**'
      - 'tmt_quantum_vault/**'
      - 'pyproject.toml'
      - 'vault_config.json'
      - 'metatron_geometry.json'
      - '.github/workflows/deploy-hf.yml'
      - 'scripts/deploy_hf.py'
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface-hub>=0.20"

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/deploy_hf.py \
            --space-name Quantum927/quantumvault \
            --private

      - name: Summary
        run: |
          echo "## ✅ Hugging Face Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://huggingface.co/spaces/Quantum927/quantumvault" >> $GITHUB_STEP_SUMMARY
