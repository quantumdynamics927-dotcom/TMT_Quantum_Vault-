name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Clone HF Space
        run: |
          git clone https://Quantum927:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Quantum927/tmt-quantum-vault-dashboard hf-space || {
            echo "Creating new Space..."
            mkdir -p hf-space
            cd hf-space
            git init
            git remote add origin https://Quantum927:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Quantum927/tmt-quantum-vault-dashboard
          }

      - name: Copy static files
        run: |
          cd hf-space
          cp ../index.html . 2>/dev/null || echo "index.html not found"
          cp ../dashboard.js . 2>/dev/null || echo "dashboard.js not found"
          cp ../research-status.html . 2>/dev/null || echo "research-status.html not found"
          cp ../README_HF.md README.md 2>/dev/null || echo "README_HF.md not found"

      - name: Create Space config
        run: |
          cd hf-space
          cat > README.md << 'EOF'
          ---
          title: TMT Quantum Vault Dashboard
          emoji: 🔮
          colorFrom: purple
          colorTo: indigo
          sdk: static
          pinned: false
          license: mit
          short_description: Multi-agent orchestration for quantum computing workflows
          ---
          
          # TMT Quantum Vault
          
          Multi-agent orchestration framework for quantum computing workflows with phi-resonance alignment.
          
          ## Features
          
          - **17-Agent Ensemble**: Specialized agents for synthesis, observation, validation, and more
          - **Three-Lane Routing**: Simulation, Quantum, and LLM execution
          - **Phi-Resonance Alignment**: Golden ratio-based coordination scoring
          - **Benchmark Suite**: 19-task evaluation matrix
          
          ## Live Dashboard
          
          Open `index.html` to view the documentation and dashboard.
          EOF

      - name: Push to Hugging Face
        run: |
          cd hf-space
          git add -A
          git commit -m "Update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes"
          git push origin main || git push -u origin main

      - name: Summary
        run: |
          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://huggingface.co/spaces/Quantum927/tmt-quantum-vault-dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Visibility**: Private (requires login)" >> $GITHUB_STEP_SUMMARY