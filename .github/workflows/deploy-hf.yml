name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Hugging Face Spaces
        run: |
          # Configure git for HF Spaces
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Clone the HF Space
          git clone https://huggingface.co/spaces/Quantum927/tmt-quantum-vault-dashboard hf-space
          cd hf-space
          
          # Copy static files
          cp ../index.html .
          cp ../dashboard.js .
          cp ../research-status.html .
          cp ../README_HF.md README.md
          
          # Commit and push
          git add -A
          git commit -m "Update from GitHub Actions: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push https://Quantum927:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Quantum927/tmt-quantum-vault-dashboard main || echo "Push completed"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: https://huggingface.co/spaces/Quantum927/tmt-quantum-vault-dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: Space is private. Only accessible to authorized users." >> $GITHUB_STEP_SUMMARY