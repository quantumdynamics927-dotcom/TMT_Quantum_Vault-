name: Deploy to Hugging Face Spaces (Static)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard.js'
      - 'research-status.html'
      - 'README_HF.md'
      - '.github/workflows/deploy-hf.yml'
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Clone HF Space
        run: |
          git clone https://Quantum927:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Quantum927/quantumvault hf-space 2>/dev/null || {
            echo "Creating new Space..."
            mkdir -p hf-space
            cd hf-space
            git init
            git remote add origin https://Quantum927:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Quantum927/quantumvault
          }

      - name: Copy static files
        run: |
          cd hf-space
          cp ../index.html . 2>/dev/null || echo "index.html not found"
          cp ../dashboard.js . 2>/dev/null || echo "dashboard.js not found"
          cp ../research-status.html . 2>/dev/null || echo "research-status.html not found"

      - name: Create Space config
        run: |
          cd hf-space
          cat > README.md << 'EOF'
          ---
          title: TMT Quantum Vault
          emoji: ⚛️
          colorFrom: blue
          colorTo: purple
          sdk: docker
          app_port: 7860
          pinned: false
          private: true
          license: mit
          short_description: 17-agent resonant intelligence lattice with phi-alignment
          ---
          
          # TMT Quantum Vault
          
          Multi-agent orchestration framework for quantum computing workflows with phi-resonance alignment.
          EOF

      - name: Push to Hugging Face
        run: |
          cd hf-space
          git add -A
          git commit -m "Update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes"
          git push origin main || git push -u origin main

      - name: Summary
        run: |
          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://huggingface.co/spaces/Quantum927/quantumvault" >> $GITHUB_STEP_SUMMARY